<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: scale(1.02);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid #eee;
    }

    .product-info {
      padding: 15px;
    }

    .product-info p {
      margin: 6px 0;
      font-size: 14px;
    }

    .product-info p strong {
      color: #444;
    }

    @media (max-width: 600px) {
      .product-card img {
        height: 150px;
      }
    }
  </style>
</head>
<body>

  <h1>Our Products</h1>
  <div class="product-grid" id="productGrid"></div>

  <!-- PapaParse for CSV reading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script>
    function displayProducts(data) {
      const container = document.getElementById('productGrid');
      data.forEach(row => {
        // Skip row if no product name or image
        if (!row["product Name"] || !row["Product Image"]) return;

        const card = document.createElement('div');
        card.className = 'product-card';
        
        card.innerHTML = `
          <img src="${row["Product Image"]}" alt="${row["product Name"]}">
          <div class="product-info">
            <p><strong>Item No:</strong> ${row["item no."]}</p>
            <p><strong>Name:</strong> ${row["product Name"]}</p>
            <p><strong>Description:</strong> ${row["Discription"]}</p>
            <p><strong>BIN:</strong> ${row["BIn"]}</p>
            <p><strong>Vehicle Model:</strong> ${row["Vehicle Model"]}</p>
            <p><strong>Company:</strong> ${row["Company"]}</p>
            <p><strong>Type:</strong> ${row["Genuine/local supply"]}</p>
            <p><strong>System:</strong> ${row["system"]}</p>
            <p><strong>Segment:</strong> ${row["vehicle segment"]}</p>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Load CSV
    Papa.parse("Engine_data.csv", {
      header: true,
      download: true,
      skipEmptyLines: true,
      complete: function(results) {
        displayProducts(results.data);
      }
    });
  </script>
</body>
</html>
